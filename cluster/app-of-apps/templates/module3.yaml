{{/*
  Template for the main app-of-apps (ocp-dev-days-rdshw-gitops).
  Deploys module 3's app-of-apps as a child Application.
*/}}
{{- if .Values.module3.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.module3.name "namespace" .Values.argocd.namespace "syncWave" "3") }}
spec:
  destination:
    namespace: openshift-gitops
    server: https://kubernetes.default.svc
  project: default
  source:
    path: cluster/app-of-apps
    repoURL: {{ .Values.module3.repoURL }}
    targetRevision: {{ .Values.module3.targetRevision }}
    helm:
      valuesObject:
        cluster:
          subdomain: {{ .Values.cluster.subdomain }}
        connectivityLink:
          llmApi:
            host: {{ .Values.vault.secrets.litellm.apiUrl | trimPrefix "https://" | trimSuffix "/v1" }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
{{- end }}
