apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cekit-build-all
  labels:
    {{- include "workspace-images.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  params:
  - name: registry
    type: string
    description: Image registry that built images will be pushed to
    default: {{ .Values.registry.hostname }}
  - name: registry-path
    type: string
    description: Path to the image within the registry
    default: {{ .Values.registry.namespace }}
  - name: repository
    type: string
    description: The git repository to pull the image and module descriptors from.
    default: {{ .Values.git.uri }}
  - name: revision
    type: string
    description: The repository branch to clone.
    default: {{ .Values.git.ref }}
  - name: m3-repository
    type: string
    description: The git repository for module 3 workspace images.
    default: {{ .Values.m3.git.uri }}
  - name: m3-revision
    type: string
    description: The repository branch for module 3 workspace images.
    default: {{ .Values.m3.git.ref }}
  tasks:
  - name: base-images
    retries: 10
    taskRef:
      name: cekit-class-builder
    params:
    - name: registry
      value: $(params.registry)
    - name: registry-path
      value: $(params.registry-path)
    - name: image-class
      value: base
    - name: repository
      value: $(params.repository)
    - name: revision
      value: $(params.revision)
  - name: app-product-images
    retries: 10
    runAfter:
    - base-images
    taskRef:
      name: cekit-class-builder
    params:
    - name: registry
      value: $(params.registry)
    - name: registry-path
      value: $(params.registry-path)
    - name: image-class
      value: workspace
    - name: repository
      value: $(params.repository)
    - name: revision
      value: $(params.revision)
  - name: m3-workspace-images
    retries: 10
    runAfter:
    - base-images
    taskRef:
      name: cekit-class-builder
    params:
    - name: registry
      value: $(params.registry)
    - name: registry-path
      value: $(params.registry-path)
    - name: image-class
      value: workspace-m3
    - name: repository
      value: $(params.m3-repository)
    - name: revision
      value: $(params.m3-revision)
